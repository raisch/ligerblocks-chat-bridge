plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

configurations {
    localRuntime
    slackEmbed
    slackDevRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly('com.slack.api:bolt-socket-mode:1.52.0')
    compileOnly('com.slack.api:bolt:1.52.0')
    compileOnly('com.slack.api:slack-api-model:1.52.0')
    compileOnly('com.slack.api:slack-api-client:1.52.0')
    compileOnly('com.slack.api:slack-app-backend:1.52.0')
    compileOnly('javax.websocket:javax.websocket-api:1.1')
    compileOnly('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20')
    slackEmbed('com.slack.api:bolt-socket-mode:1.52.0')
    slackEmbed('com.slack.api:bolt:1.52.0')
    slackEmbed('com.slack.api:slack-api-model:1.52.0')
    slackEmbed('com.slack.api:slack-api-client:1.52.0')
    slackEmbed('com.slack.api:slack-app-backend:1.52.0')
    slackEmbed('javax.websocket:javax.websocket-api:1.1')
    slackEmbed('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20')
    ['com.slack.api:bolt-socket-mode:1.52.0',
     'com.slack.api:bolt:1.52.0',
     'com.slack.api:slack-app-backend:1.52.0',
     'javax.websocket:javax.websocket-api:1.1',
     'org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20'].each { dependency ->
        slackDevRuntime(dependency) {
            if (dependency.startsWith('com.slack.api:')) {
                exclude group: 'com.slack.api', module: 'slack-api-client'
                exclude group: 'com.slack.api', module: 'slack-api-model'
            }
        }
    }
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

configurations.configureEach {
    resolutionStrategy.force(
            'com.google.code.gson:gson:2.12.1',
            'org.apache.commons:commons-lang3:3.14.0',
            'org.slf4j:slf4j-api:2.0.9'
    )
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('slackApiClientRuntimeJar', Jar) {
    archiveBaseName = 'ligerblocks-slack-api-client-runtime'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.slackEmbed
            .filter { it.name.startsWith('slack-api-client-') || it.name.startsWith('slack-api-model-') }
            .collect { zipTree(it) }) {
        exclude('META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA')
        exclude('com/google/gson/**', 'com/google/errorprone/**',
                'org/apache/commons/lang3/**', 'org/slf4j/**')
    }
}

dependencies.add(
        'slackDevRuntime',
        project.dependencies.create(project.files(tasks.named('slackApiClientRuntimeJar'))))

tasks.matching { it.name == 'prepareServerRun' }.configureEach {
    dependsOn tasks.named('slackApiClientRuntimeJar')
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.slackDevRuntime)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]

    inputs.properties(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

sourceSets.main.resources.srcDir tasks.named('generateModMetadata')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.slackEmbed.collect { zipTree(it) }) {
        exclude('META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA')
        exclude('com/google/gson/**', 'com/google/errorprone/**',
                'org/apache/commons/lang3/**', 'org/slf4j/**')
    }
}

tasks.register('verifyModJar') {
    dependsOn tasks.named('jar')

    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def entryPoint = 'com/ligerbots/ligerblockschatbridge/LigerBlocksChatBridge.class'
        def metadataPath = 'META-INF/neoforge.mods.toml'
        def expectedModId = mod_id
        def expectedVersion = mod_version
        def expectedMinecraftRange = minecraft_version_range
        def expectedNeoForgeRange = "[${neo_version},)"

        assert artifact.isFile(): "Missing mod artifact: ${artifact}"
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            assert archive.getEntry(entryPoint) != null: "Missing mod entry point: ${entryPoint}"
            assert archive.getEntry('com/slack/api/bolt/App.class') != null: 'Embedded Slack Bolt classes are missing'
            assert archive.getEntry('com/slack/api/util/json/JavaTimeInstantFactory.class') != null:
                    'Embedded Slack model classes are missing'
            assert archive.getEntry('com/google/gson/Gson.class') == null:
                    'Gson classes must be provided by NeoForge, not embedded in the mod'
            assert archive.getEntry('com/google/errorprone/annotations/CheckReturnValue.class') == null:
                    'Error Prone annotations must be provided by NeoForge, not embedded in the mod'
            assert archive.getEntry('org/apache/commons/lang3/StringUtils.class') == null:
                    'Apache Commons classes must be provided by NeoForge, not embedded in the mod'
            assert archive.getEntry('org/slf4j/Logger.class') == null:
                    'SLF4J classes must be provided by NeoForge, not embedded in the mod'
            def metadata = archive.getInputStream(archive.getEntry(metadataPath)).getText('UTF-8')
            assert metadata.contains("modId=\"${expectedModId}\""): 'Expanded mod ID is missing'
            assert metadata.contains("version=\"${expectedVersion}\""): 'Expanded mod version is missing'
            assert metadata.contains("versionRange=\"${expectedMinecraftRange}\""): 'Minecraft compatibility range is missing'
            assert metadata.contains("versionRange=\"${expectedNeoForgeRange}\""): 'NeoForge compatibility range is missing'
        }

        logger.lifecycle("Verified ${artifact.name}: entry point and expanded NeoForge metadata are present")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModJar')
}

tasks.register('createChecksums') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(artifact.bytes)
                .collect { String.format('%02x', it) }
                .join()
        def checksumFile = new File(artifact.parentFile, "${artifact.name}.sha256")
        checksumFile.text = "${digest}  ${artifact.name}${System.lineSeparator()}"
        logger.lifecycle("Wrote ${checksumFile.name}")
    }
}

tasks.named('build') {
    dependsOn tasks.named('createChecksums')
}
