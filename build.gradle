plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation('com.slack.api:bolt-socket-mode:1.52.0')
    implementation('com.slack.api:bolt:1.52.0')
    implementation('com.slack.api:slack-api-model:1.52.0')
    implementation('com.slack.api:slack-api-client:1.52.0')
    implementation('com.slack.api:slack-app-backend:1.52.0')
    implementation('javax.websocket:javax.websocket-api:1.1')
    implementation('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20')
    localRuntime('com.slack.api:bolt-socket-mode:1.52.0')
    localRuntime('com.slack.api:bolt:1.52.0')
    localRuntime('com.slack.api:slack-api-model:1.52.0')
    localRuntime('com.slack.api:slack-api-client:1.52.0')
    localRuntime('com.slack.api:slack-app-backend:1.52.0')
    localRuntime('javax.websocket:javax.websocket-api:1.1')
    localRuntime('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20')
    runtimeOnly('com.slack.api:bolt-socket-mode:1.52.0')
    runtimeOnly('com.slack.api:bolt:1.52.0')
    runtimeOnly('com.slack.api:slack-api-model:1.52.0')
    runtimeOnly('com.slack.api:slack-api-client:1.52.0')
    runtimeOnly('com.slack.api:slack-app-backend:1.52.0')
    runtimeOnly('javax.websocket:javax.websocket-api:1.1')
    runtimeOnly('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20')
    jarJar(implementation('com.slack.api:bolt-socket-mode:1.52.0'))
    jarJar(implementation('com.slack.api:bolt:1.52.0'))
    jarJar(implementation('com.slack.api:slack-api-model:1.52.0'))
    jarJar(implementation('com.slack.api:slack-api-client:1.52.0'))
    jarJar(implementation('com.slack.api:slack-app-backend:1.52.0'))
    jarJar(implementation('javax.websocket:javax.websocket-api:1.1'))
    jarJar(implementation('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20'))
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

configurations.configureEach {
    resolutionStrategy.force(
            'com.google.code.gson:gson:2.10.1',
            'org.apache.commons:commons-lang3:3.14.0',
            'org.slf4j:slf4j-api:2.0.9'
    )
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.runtimeClasspath)
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('com.slack.api:bolt-socket-mode:1.52.0'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('com.slack.api:bolt:1.52.0'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('com.slack.api:slack-api-model:1.52.0'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('com.slack.api:slack-api-client:1.52.0'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('com.slack.api:slack-app-backend:1.52.0'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('javax.websocket:javax.websocket-api:1.1'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20'))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]

    inputs.properties(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

sourceSets.main.resources.srcDir tasks.named('generateModMetadata')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('verifyModJar') {
    dependsOn tasks.named('jar')

    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def entryPoint = 'com/ligerbots/ligerblockschatbridge/LigerBlocksChatBridge.class'
        def metadataPath = 'META-INF/neoforge.mods.toml'
        def expectedModId = mod_id
        def expectedVersion = mod_version
        def expectedMinecraftRange = minecraft_version_range
        def expectedNeoForgeRange = "[${neo_version},)"

        assert artifact.isFile(): "Missing mod artifact: ${artifact}"
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            assert archive.getEntry(entryPoint) != null: "Missing mod entry point: ${entryPoint}"
            def metadata = archive.getInputStream(archive.getEntry(metadataPath)).getText('UTF-8')
            assert metadata.contains("modId=\"${expectedModId}\""): 'Expanded mod ID is missing'
            assert metadata.contains("version=\"${expectedVersion}\""): 'Expanded mod version is missing'
            assert metadata.contains("versionRange=\"${expectedMinecraftRange}\""): 'Minecraft compatibility range is missing'
            assert metadata.contains("versionRange=\"${expectedNeoForgeRange}\""): 'NeoForge compatibility range is missing'
        }

        logger.lifecycle("Verified ${artifact.name}: entry point and expanded NeoForge metadata are present")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModJar')
}
